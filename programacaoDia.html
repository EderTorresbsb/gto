<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Relatório de Atendimento</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .cabecalho {
            background: #075e54;
            color: white;
            padding: 25px;
            border-radius: 15px 15px 0 0;
            text-align: center;
        }

        .cabecalho h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .cabecalho p {
            margin: 0;
            opacity: 0.9;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #075e54;
            box-shadow: 0 0 0 3px rgba(7,94,84,0.1);
        }

        textarea {
            min-height: 70px;
            resize: vertical;
        }

        .linha {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .btn-whatsapp {
            background: #25d366;
            color: white;
        }

        .btn-copiar {
            background: #2563eb;
            color: white;
        }

        .btn-limpar {
            background: #64748b;
            color: white;
        }

        .preview {
            margin-top: 25px;
        }

        .preview h2 {
            font-size: 19px;
            margin-bottom: 10px;
        }

        #mensagemPreview {
            width: 100%;
            min-height: 300px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 15px;
            white-space: pre-wrap;
            font-family: Arial, sans-serif;
            font-size: 15px;
            line-height: 1.5;
        }

        .aviso {
            margin-top: 15px;
            padding: 12px;
            background: #ecfdf5;
            border-left: 4px solid #25d366;
            border-radius: 5px;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .card {
                padding: 18px;
            }

            .linha {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .botoes {
                grid-template-columns: 1fr;
            }

            .cabecalho h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="cabecalho">
        <h1>📋 RELATÓRIO DE ATENDIMENTO</h1>
        <p>Preencha os dados e envie pelo WhatsApp</p>
    </div>

    <div class="card">

        <!-- DATA -->
        <div class="campo">
            <label for="data">📅 Data</label>
            <input type="date" id="data">
        </div>

        <!-- ATENDIMENTO -->
        <div class="campo">
            <label for="cdf">👷 Atendimento CDF</label>
            <input
                type="text"
                id="cdf"
                placeholder="Ex.: ADEILSON, JOVAILSON, RAIMUNDO">
        </div>

        <div class="campo">
            <label for="cn2">👷 Atendimento CN2</label>
            <input
                type="text"
                id="cn2"
                placeholder="Digite os nomes">
        </div>

        <!-- SERVIÇOS -->
        <div class="linha">

            <div class="campo">
                <label for="afericao">🔧 Aferição</label>
                <input
                    type="text"
                    id="afericao"
                    placeholder="Digite os nomes">
            </div>

            <div class="campo">
                <label for="pontoServico">🔧 Ponto e Serviço</label>
                <input
                    type="text"
                    id="pontoServico"
                    placeholder="Digite a informação">
            </div>

        </div>

        <!-- CAIXA / PONTO -->
        <div class="campo">
            <label for="atualizacaoCaixa">💰 Atualização de Caixa</label>
            <input
                type="text"
                id="atualizacaoCaixa"
                placeholder="Ex.: ROBSON, WANDERSON">
        </div>

        <div class="campo">
            <label for="ponto">📍 Ponto</label>
            <input
                type="text"
                id="ponto"
                placeholder="Ex.: DER777">
        </div>

        <!-- CAMINHÃO 01 -->
        <div class="campo">
            <label for="caminhao1">🚛 Caminhão 01</label>
            <input
                type="text"
                id="caminhao1"
                placeholder="Ex.: ALESSANDRO, ELDER, JESSER, MIGUEL">
        </div>

        <div class="campo">
            <label for="rodovia1">🛣️ Rodovia, Ponto e Serviço</label>
            <input
                type="text"
                id="rodovia1"
                placeholder="Ex.: IMPLANTAÇÃO DER777">
        </div>

        <!-- CAMINHÃO 02 -->
        <div class="campo">
            <label for="caminhao2">🚛 Caminhão 02</label>
            <input
                type="text"
                id="caminhao2"
                placeholder="Digite os nomes">
        </div>

        <div class="campo">
            <label for="rodovia2">🛣️ Rodovia, Ponto e Serviço</label>
            <input
                type="text"
                id="rodovia2"
                placeholder="Digite a informação">
        </div>

        <!-- FIORINO -->
        <div class="campo">
            <label for="fiorino">🚐 Fiorino</label>
            <input
                type="text"
                id="fiorino"
                placeholder="Ex.: ANDRE, MACIEL">
        </div>

        <div class="campo">
            <label for="rodovia3">🛣️ Rodovia, Ponto e Serviço</label>
            <input
                type="text"
                id="rodovia3"
                placeholder="Ex.: DF-001">
        </div>


        <!-- BOTÕES -->
        <div class="botoes">

            <button
                class="btn-whatsapp"
                onclick="enviarWhatsApp()">
                📱 ENVIAR WHATSAPP
            </button>

            <button
                class="btn-copiar"
                onclick="copiarMensagem()">
                📋 COPIAR MENSAGEM
            </button>

            <button
                class="btn-limpar"
                onclick="limparFormulario()">
                🗑️ LIMPAR
            </button>

        </div>


        <!-- PREVIEW -->
        <div class="preview">

            <h2>👀 Visualização da mensagem</h2>

            <textarea
                id="mensagemPreview"
                readonly></textarea>

            <div class="aviso">
                <strong>Como funciona:</strong>
                o botão do WhatsApp abre uma conversa no WhatsApp
                com a mensagem já preenchida. Você escolhe o contato
                ou grupo e toca em enviar.
            </div>

        </div>

    </div>

</div>


<script>

    // =========================================================
    // COLOCA A DATA ATUAL AUTOMATICAMENTE
    // =========================================================

    function colocarDataAtual() {

        const hoje = new Date();

        const ano = hoje.getFullYear();

        const mes = String(hoje.getMonth() + 1).padStart(2, '0');

        const dia = String(hoje.getDate()).padStart(2, '0');

        document.getElementById("data").value =
            `${ano}-${mes}-${dia}`;
    }


    // =========================================================
    // RETORNA O DIA DA SEMANA EM PORTUGUÊS
    // =========================================================

    function nomeDiaSemana(data) {

        const dias = [
            "DOMINGO",
            "SEGUNDA FEIRA",
            "TERÇA FEIRA",
            "QUARTA FEIRA",
            "QUINTA FEIRA",
            "SEXTA FEIRA",
            "SÁBADO"
        ];

        const dataObj = new Date(data + "T00:00:00");

        return dias[dataObj.getDay()];
    }


    // =========================================================
    // FORMATA A DATA
    // =========================================================

    function formatarData(data) {

        if (!data) {
            return "";
        }

        const partes = data.split("-");

        const ano = partes[0];

        const mes = partes[1];

        const dia = partes[2];

        return `${dia}/${mes}/${ano}`;
    }


    // =========================================================
    // PEGA O VALOR DE UM CAMPO
    // =========================================================

    function valor(id) {

        return document
            .getElementById(id)
            .value
            .trim();
    }


    // =========================================================
    // MONTA A MENSAGEM
    // =========================================================

    function gerarMensagem() {

        const data = valor("data");

        let mensagem = "";

        // CABEÇALHO

        if (data) {

            mensagem +=
                "*" +
                nomeDiaSemana(data) +
                ", " +
                formatarData(data) +
                "*" +
                "\n";

        }


        // CAMPOS

        mensagem +=
            "*ATENDIMENTO CDF:* " +
            valor("cdf") +
            "\n";

        mensagem +=
            "*ATENDIMENTO CN2:* " +
            valor("cn2") +
            "\n";

        mensagem +=
            "*AFERIÇÃO:* " +
            valor("afericao") +
            "\n";

        mensagem +=
            "*PONTO E SERVIÇO:* " +
            valor("pontoServico") +
            "\n";

        mensagem +=
            "*ATUALIZAÇÃO DE CAIXA:* " +
            valor("atualizacaoCaixa") +
            "\n";

        mensagem +=
            "*PONTO:* " +
            valor("ponto") +
            "\n";

        mensagem +=
            "*CAMINHÃO 01:* " +
            valor("caminhao1") +
            "\n";

        mensagem +=
            "*RODOVIA, PONTO E SERVIÇO:* " +
            valor("rodovia1") +
            "\n";

        mensagem +=
            "*CAMINHÃO 02:* " +
            valor("caminhao2") +
            "\n";

        mensagem +=
            "*RODOVIA, PONTO E SERVIÇO:* " +
            valor("rodovia2") +
            "\n";

        mensagem +=
            "*FIORINO:* " +
            valor("fiorino") +
            "\n";

        mensagem +=
            "*RODOVIA, PONTO E SERVIÇO:* " +
            valor("rodovia3");


        // MOSTRA NA TELA

        document.getElementById("mensagemPreview").value =
            mensagem;

        return mensagem;
    }


    // =========================================================
    // ATUALIZA A MENSAGEM ENQUANTO DIGITA
    // =========================================================

    document.addEventListener("input", function() {

        gerarMensagem();

    });


    // =========================================================
    // ENVIA PARA O WHATSAPP
    // =========================================================

    function enviarWhatsApp() {

        const mensagem = gerarMensagem();

        if (!mensagem.trim()) {

            alert("Preencha os dados antes de enviar.");

            return;
        }

        const textoCodificado =
            encodeURIComponent(mensagem);

        const url =
            "https://wa.me/?text=" +
            textoCodificado;

        window.open(url, "_blank");

    }


    // =========================================================
    // COPIAR MENSAGEM
    // =========================================================

    async function copiarMensagem() {

        const mensagem = gerarMensagem();

        try {

            await navigator.clipboard.writeText(mensagem);

            alert("Mensagem copiada com sucesso!");

        } catch (erro) {

            alert(
                "Não foi possível copiar automaticamente. " +
                "Selecione a mensagem e copie manualmente."
            );

        }

    }


    // =========================================================
    // LIMPAR FORMULÁRIO
    // =========================================================

    function limparFormulario() {

        const confirmar =
            confirm(
                "Deseja realmente limpar todos os campos?"
            );

        if (!confirmar) {
            return;
        }

        document
            .querySelectorAll("input")
            .forEach(function(campo) {

                campo.value = "";

            });

        document.getElementById(
            "mensagemPreview"
        ).value = "";

        colocarDataAtual();

        gerarMensagem();

    }


    // =========================================================
    // INICIALIZAÇÃO
    // =========================================================

    colocarDataAtual();

    gerarMensagem();

</script>

</body>
</html>
